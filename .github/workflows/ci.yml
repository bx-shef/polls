name: CI

# push только для main, всё остальное ловит pull_request. При `branches: ['**']`
# каждый пуш в ветку с открытым PR запускал workflow дважды: у событий разный
# `github.ref`, поэтому и группа `concurrency` разная, и вторая сборка не отменялась.
# Ветка без PR остаётся без CI сознательно — в main всё равно только через PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      # Действия закреплены по SHA, а не по тегу: тег перемещаем не мы, и подменённый
      # тег — это чужой код в нашем CI с доступом к GITHUB_TOKEN. Взято у client-bank-alfa-by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Единый гейт: границы слоёв, линт, типы, тесты. Разбивать на отдельные шаги
      # незачем — локально перед пушем запускается ровно эта команда.
      - run: pnpm check

  image:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      # Действия закреплены по SHA, а не по тегу: тег перемещаем не мы, и подменённый
      # тег — это чужой код в нашем CI с доступом к GITHUB_TOKEN. Взято у client-bank-alfa-by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Публикуем только с main: с ветки образ собирается ради проверки, что Dockerfile
      # жив, но в реестр не уезжает.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
