user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # --- Логи без полных адресов -------------------------------------------------
    # Адрес респондента — персональные данные, а логи переживают инцидент и утекают
    # вместе с ним. Для разбора инцидента хватает подсети: у IPv4 обнуляем последний
    # октет, у IPv6 оставляем /64.
    map $remote_addr $ip_anon {
        default                                          "0.0.0.0";
        "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                   "$v4.0";
        "~^(?<v6>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):"  "$v6::";
    }

    log_format anon '$ip_anon - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" ${request_time}s';
    access_log /var/log/nginx/access.log anon;

    # --- Ограничение частоты -----------------------------------------------------
    # Прохождение анкеты — редкое действие человека; приём ответа тем более.
    # Статика (/_nuxt/) не ограничивается: она грузится пачкой на одну страницу.
    limit_req_zone $binary_remote_addr zone=survey_page:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=survey_submit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream app {
        server app:3000;
        keepalive 16;
    }

    # Заголовки к апстриму — одинаковые везде, поэтому вынесены в файл.
    # (см. proxy-headers.conf рядом)

    # Слушаем только IPv4 намеренно: `listen [::]:80` на хосте без IPv6 не даёт nginx
    # стартовать вообще, а без него сайт всего лишь недоступен по IPv6, которого у клиента
    # почти наверняка и нет. Есть IPv6 на хосте — добавить `listen [::]:80;` и
    # `listen [::]:443 ssl;` в блоки ниже.
    server {
        listen 80;
        server_name polls.bx-shef.by;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name polls.bx-shef.by;

        ssl_certificate     /etc/letsencrypt/live/polls.bx-shef.by/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/polls.bx-shef.by/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- Публичная страница анкеты -------------------------------------------
        # Отдельный мир: её открывает внешний респондент, встраивать её в чужие
        # страницы незачем, поэтому frame-ancestors 'none' — в отличие от приложения,
        # которое обязано открываться в iframe портала.
        location /s/ {
            limit_req zone=survey_page burst=20 nodelay;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://app;
        }

        # Приём ответа с публичной страницы: лимит жёстче, чем на показ.
        location /api/public/ {
            limit_req zone=survey_submit burst=5 nodelay;

            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;

            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://app;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;

            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://app;
        }

        location /_nuxt/ {
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://app;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # --- Приложение внутри портала -------------------------------------------
        # Список региональных доменов Битрикс24 — единственное место, где он нужен,
        # и он неочевиден: у части зон адрес двухсегментный (com.br, com.tr).
        # Без этого заголовка портал покажет пустой iframe и ничего не объяснит.
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.bitrix24.ru https://*.bitrix24.by https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.es https://*.bitrix24.pl https://*.bitrix24.in https://*.bitrix24.jp https://*.bitrix24.vn https://*.bitrix24.mx https://*.bitrix24.id https://*.bitrix24.com.br https://*.bitrix24.com.tr; frame-ancestors https://*.bitrix24.ru https://*.bitrix24.by https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.com https://*.bitrix24.eu https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.es https://*.bitrix24.pl https://*.bitrix24.in https://*.bitrix24.jp https://*.bitrix24.vn https://*.bitrix24.mx https://*.bitrix24.id https://*.bitrix24.com.br https://*.bitrix24.com.tr; base-uri 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://app;
        }
    }

    # Домен клиента добавляется вторым server-блоком руками — это услуга, а не функция
    # приложения (`docs/PROCESS.md`, раздел 8). Копия блока выше со своим server_name
    # и своим сертификатом; в портале при этом заполняется `portals.public_host`.
}
