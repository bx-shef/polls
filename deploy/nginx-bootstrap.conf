user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 64;
}

# Конфигурация ровно на один раз: выпустить первый сертификат.
#
# Боевой nginx.conf ссылается на файлы сертификата и без них не стартует вообще,
# а сертификата на чистом хосте ещё нет — Let's Encrypt проверяет владение доменом
# по HTTP. Замкнутый круг разрывается этим файлом: он поднимает только 80 порт
# и отдаёт каталог проверки. Используется из `make cert`, руками трогать не нужно.
http {
    server_tokens off;
    access_log /var/log/nginx/access.log;

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            default_type text/plain;
            return 200 "Выпуск сертификата. Приложение поднимется следом.\n";
        }
    }
}
