name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Граница ~core (клиент не тянет server-only ядро, #36)
        run: pnpm check:boundary

      # Забытый `await` (#165) + `recommended`. Типовые правила по server/ и app/ читают
      # сгенерированные `.nuxt/tsconfig.*`, поэтому `pnpm lint` сам зовёт `nuxt prepare` — на чистом
      # клоне без него линт падает 41 ошибкой разбора. Он же готовит `.nuxt` для шага ниже, поэтому
      # отдельного `nuxt:prepare` там больше нет. (Тихий режим отказа у ESLint другой: файл, не
      # совпавший ни с одним `files`, пропускается без слова и с кодом 0 — это ловит
      # `test/lint-gate.test.ts` сверкой списков.)
      - name: Lint (забытый await + recommended)
        run: pnpm lint

      # vue-tsc-typecheck клиента И сервера (app/+server/). Отдельно от ядрового `pnpm typecheck`
      # (ядро framework-agnostic). typecheck:app берёт tsconfig.json (app/shared), typecheck:server —
      # tsconfig.server.json: без второго серверные файлы (server/**) типами не гейтились бы.
      - name: Typecheck app/ + server/ (vue-tsc, #36)
        run: pnpm typecheck:app && pnpm typecheck:server

      - name: Test (+ покрытие, пороги в vitest.config.ts)
        run: pnpm test:cov

      - name: Verify (итог на 4 уровнях)
        run: pnpm verify
