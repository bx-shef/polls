# Прод-стек для ОБЩЕГО хоста, устроенного как у `client-bank-alfa-by`.
#
# На хосте уже работают, поднятые один раз и общие на все проекты:
#   * `nginx-proxy` + `acme-companion` на внешней сети `proxy-net` — TLS и маршрутизация
#     по `VIRTUAL_HOST`, сертификаты по `LETSENCRYPT_HOST`;
#   * один Watchtower с `--label-enable` — подхватывает контейнеры по метке.
#
# Поэтому здесь нет ни своего nginx, ни своего Watchtower, ни certbot. Второй экземпляр
# Watchtower конфликтует по `container_name` и плодит двойные перезапуски; второй nginx
# просто не займёт уже занятые 80 и 443.
#
# Порядок первого развёртывания — в `deploy/README.md`.

# Ротация логов: без неё docker пишет json-file без предела и однажды забивает диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  app:
    logging: *default-logging
    image: ${APP_IMAGE:-ghcr.io/bx-shef/polls:latest}
    container_name: polls
    restart: unless-stopped
    # Наружу не публикуем ни одного порта: до приложения ходит только nginx-proxy.
    expose:
      - '3000'
    environment:
      # Подхватывается nginx-proxy и acme-companion.
      VIRTUAL_HOST: ${DOMAIN:?DOMAIN не задан}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}

      DATABASE_URL: postgres://survey:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}@db:5432/survey
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: https://${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - proxy-net   # перед нами общий nginx-proxy; через эту же сеть идёт выход в REST портала
      - dbnet       # к базе и Redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      # Подхватывается общим на хост Watchtower. Свой мы не поднимаем.
      - 'com.centurylinklabs.watchtower.enable=true'

  # Одноразовый запуск того же образа: `make prod-migrate`.
  # Профиль нужен, чтобы сервис не поднимался вместе со стеком.
  migrate:
    logging: *default-logging
    image: ${APP_IMAGE:-ghcr.io/bx-shef/polls:latest}
    profiles: [tools]
    command: ['node', '.output/server/migrate.mjs']
    environment:
      DATABASE_URL: postgres://survey:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}@db:5432/survey
    networks: [dbnet]
    depends_on:
      db:
        condition: service_healthy

  db:
    logging: *default-logging
    image: postgres:17-alpine
    container_name: polls-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: survey
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [dbnet]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U survey -d survey']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:8-alpine
    container_name: polls-redis
    restart: unless-stopped
    # Состояние очередей переживает перезапуск: задание на запись в портал терять нельзя.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks: [dbnet]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # Создаётся один раз вместе с nginx-proxy, не нами.
  proxy-net:
    external: true
  # База и Redis: `internal: true` — выхода в интернет нет вообще.
  dbnet:
    internal: true

volumes:
  db-data:
  redis-data:
